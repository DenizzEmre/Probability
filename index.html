<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free Throws Until the First Score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#F1B82D; --gold-soft:#FCEFCB; --ink:#000000; --ink-2:#3a3a3a; --muted:#6b6b6b;
  --bg:#ffffff; --panel:#f4f4f2; --line:#dedcd6; --miss:#B03A2E; --make:#2E7D4F;
  --wood:#E9C79A; --wood-2:#DDB27C; --navy:#1F3A68;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f5f5f5; --ink-2:#d6d6d6; --muted:#a3a3a3; --bg:#121212; --panel:#1e1e1e; --line:#333;
    --gold-soft:#3a3016; --wood:#5a4630; --wood-2:#4d3b27; --navy:#9db8e8;
  }
}
:root[data-theme="dark"]{
  --ink:#f5f5f5; --ink-2:#d6d6d6; --muted:#a3a3a3; --bg:#121212; --panel:#1e1e1e; --line:#333;
  --gold-soft:#3a3016; --wood:#5a4630; --wood-2:#4d3b27; --navy:#9db8e8;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit","Satoshi","Segoe UI",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.4;font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:20px 24px 32px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
h1{font-size:clamp(26px,3.2vw,40px);font-weight:800;letter-spacing:-0.02em;margin:0;line-height:1.05}
.sub{color:var(--muted);margin:4px 0 0;font-size:16px}
.teams{display:flex;flex-wrap:wrap;gap:8px}
.team-tab{border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:600;font-size:15px;padding:7px 14px 7px 10px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:8px}
.team-tab .sw{width:14px;height:14px;border-radius:50%}
.team-tab[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:20px;align-items:start}
.court{background:var(--panel);border-radius:18px;overflow:hidden;position:relative}
.court svg{display:block;width:100%;height:auto}
.result{position:absolute;top:16px;left:20px;font-size:clamp(22px,2.6vw,34px);font-weight:800;letter-spacing:-0.01em;opacity:0;transition:opacity .2s}
.result.show{opacity:1}
.attempts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 18px 16px;min-height:58px}
.attempts .lbl{font-weight:600;color:var(--ink-2);margin-right:4px}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
.dot.miss{background:var(--miss)} .dot.make{background:var(--make)}

.side{display:flex;flex-direction:column;gap:16px}
.box{background:var(--panel);border-radius:18px;padding:18px}
.box h2{font-size:18px;margin:0 0 10px;font-weight:700}
.team-name{font:inherit;font-size:22px;font-weight:800;border:none;background:transparent;color:var(--ink);width:100%;padding:2px 0;border-bottom:2px dashed transparent}
.team-name:hover,.team-name:focus{border-bottom-color:var(--line);outline:none}
.p-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}
.p-val{font-size:44px;font-weight:800;line-height:1}
.p-row span{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--gold);height:28px;margin:6px 0 2px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{font:inherit;font-weight:700;font-size:17px;border:none;border-radius:12px;padding:14px 12px;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--gold);color:#000;grid-column:1/-1;font-size:20px;padding:16px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toggle{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink-2);font-size:15px}
.toggle input{width:18px;height:18px;accent-color:var(--gold)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.stat .k{color:var(--muted);font-size:14px}
.stat .v{font-size:26px;font-weight:700;line-height:1.1}
.stat .v small{font-size:15px;color:var(--muted);font-weight:500}
.note{margin-top:10px;font-size:14px;color:var(--miss);display:none}
.note.show{display:block}

.lower{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:20px;margin-top:20px;align-items:start}
.chart-box svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:18px;font-size:14px;color:var(--ink-2);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px;border-radius:3px}
.legend i.th{background:transparent;border:2.5px solid var(--ink);border-radius:50%;width:12px;height:12px}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
tr.sel td{font-weight:700}
.sw-inline{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:14px;color:var(--muted);font-size:14px}
.foot button{font:inherit;font-size:14px;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}

.xs{margin-top:12px;font-size:15px;color:var(--ink-2);word-break:break-word}
.xs b{color:var(--ink)}
.ev .formula{font-family:"Cambria","Cambria Math",Georgia,serif;font-style:italic;font-size:19px;line-height:1.7;color:var(--navy)}
.ev .formula sup{font-size:.7em}
.ev p{margin:6px 0 10px;color:var(--ink-2)}
.ev .step{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;margin:6px 0 14px}
.ev .step .n{font-weight:700;color:var(--muted);font-size:14px}
.ev table td,.ev table th{padding:5px 6px}
.ev .conv{margin-top:10px;font-weight:600}
.rules ol{margin:6px 0 0;padding-left:22px}
.rules li{margin-bottom:10px}
.rules h3{font-size:16px;margin:14px 0 4px}
.rules p{margin:4px 0;color:var(--ink-2)}
.hidden-p .reveal-only{display:none}
.mode{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;background:var(--gold-soft);padding:8px 12px;border-radius:10px;cursor:pointer}
.mode input{width:18px;height:18px;accent-color:var(--gold)}
@media (max-width:900px){.main,.lower{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){.result{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Free throws until the first score</h1>
      <p class="sub">X = number of attempts until the first made shot. X ~ Geo(p)</p>
    </div>
  </header>

  <div class="main">
   <div class="side">
    <div class="court">
      <div class="result" id="result" aria-live="polite"></div>
      <svg id="scene" viewBox="0 0 800 430" role="img" aria-label="Basketball court with a shooter and a hoop">
        <defs>
          <clipPath id="ballClip"><circle r="17" cx="0" cy="0"/></clipPath>
        </defs>
        <!-- floor -->
        <rect x="0" y="360" width="800" height="70" fill="var(--wood)"/>
        <g stroke="var(--wood-2)" stroke-width="2">
          <line x1="0" y1="378" x2="800" y2="378"/><line x1="0" y1="398" x2="800" y2="398"/><line x1="0" y1="416" x2="800" y2="416"/>
        </g>
        <line x1="190" y1="360" x2="190" y2="430" stroke="#ffffff" stroke-width="5"/>
        <text x="200" y="352" font-size="14" fill="var(--muted)" font-family="Outfit, sans-serif">free throw line</text>
        <!-- hoop stand -->
        <rect x="726" y="80" width="10" height="282" fill="var(--ink-2)"/>
        <rect x="690" y="64" width="16" height="150" rx="3" fill="#ffffff" stroke="var(--ink-2)" stroke-width="3"/>
        <rect x="706" y="110" width="22" height="8" fill="var(--ink-2)"/>
        <rect x="693" y="138" width="10" height="44" fill="none" stroke="var(--miss)" stroke-width="2"/>
        <!-- net -->
        <g id="net">
          <path d="M600 182 L612 238 L668 238 L680 182" fill="none" stroke="var(--ink-2)" stroke-width="2"/>
          <path d="M612 182 L622 238 M626 182 L633 238 M640 182 L640 238 M654 182 L647 238 M668 182 L658 238" stroke="var(--ink-2)" stroke-width="1.5" fill="none"/>
          <path d="M604 200 L676 200 M607 218 L673 218" stroke="var(--ink-2)" stroke-width="1.5" fill="none"/>
        </g>
        <!-- shooter -->
        <g id="shooter" fill="var(--ink)">
          <circle cx="140" cy="196" r="20"/>
          <rect x="124" y="218" width="32" height="76" rx="12" id="jersey" fill="var(--gold)"/>
          <rect x="126" y="292" width="11" height="68" rx="5"/>
          <rect x="143" y="292" width="11" height="68" rx="5"/>
          <line x1="152" y1="230" x2="166" y2="186" stroke="var(--ink)" stroke-width="11" stroke-linecap="round" id="arm"/>
        </g>
        <!-- ball -->
        <g id="ball" transform="translate(168,168)">
          <g id="ballSpin">
            <circle r="17" fill="#E07B24" stroke="#5a2e0c" stroke-width="2"/>
            <g clip-path="url(#ballClip)" stroke="#5a2e0c" stroke-width="1.6" fill="none">
              <line x1="-17" y1="0" x2="17" y2="0"/><line x1="0" y1="-17" x2="0" y2="17"/>
              <path d="M-12 -12 Q0 0 -12 12"/><path d="M12 -12 Q0 0 12 12"/>
            </g>
          </g>
        </g>
        <!-- rim drawn on top of the ball so made shots pass behind the front rim -->
        <line x1="598" y1="182" x2="690" y2="182" stroke="var(--miss)" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <div class="attempts" id="attempts" aria-live="polite"></div>
    </div>
   </div>

    <div class="side">
      <div class="box">
        <h2 style="font-size:22px;margin:0">Shooter settings</h2>
        <div class="p-row"><span>p = probability of scoring on each attempt</span></div>
        <div class="p-row"><div class="p-val" id="pVal">0.40</div><span id="pMean">E(X) = 2.50</span></div>
        <input type="range" id="p" min="0.05" max="0.95" step="0.05" value="0.4" aria-label="Probability of scoring">
        <div class="presets" id="presets"></div>
        <div class="btns">
          <button class="btn primary" id="untilBtn">Shoot until score</button>
          <button class="btn" id="oneBtn">Shoot once</button>
          <button class="btn" id="fiveBtn">Play 5 rounds</button>
        </div>
        <label class="toggle"><input type="checkbox" id="fast"> Fast animation</label>
      </div>

    </div>
  </div>
</div>

<script>
(function(){
  let state;
  try { state = JSON.parse(localStorage.getItem("geoShot")); } catch(e) { state = null; }
  if (!state || typeof state.p !== "number") state = { p:0.4, current:[] };
  state.current = state.current || [];
  const save = () => { try { localStorage.setItem("geoShot", JSON.stringify(state)); } catch(e) {} };
  const $ = id => document.getElementById(id);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let busy = false;

  [0.2,0.4,0.5,0.7,0.9].forEach(v=>{
    const b=document.createElement("button"); b.textContent=v.toFixed(1);
    b.onclick=()=>{ if(!busy) setP(v); };
    $("presets").appendChild(b);
  });
  function setP(v){ state.p = Math.round(v*100)/100; save(); renderAll(); }
  $("p").addEventListener("input", e => setP(parseFloat(e.target.value)));

  // animation
  const ball=$("ball"), spin=$("ballSpin"), arm=$("arm"), result=$("result");
  const START={x:168,y:168}; let angle=0;
  function place(x,y){ ball.setAttribute("transform","translate("+x+","+y+")"); spin.setAttribute("transform","rotate("+angle+")"); }
  const speed = () => reduce ? 0.15 : ($("fast").checked ? 0.4 : 1);
  function arc(from,to,h,dur){
    dur*=speed();
    return new Promise(res=>{
      const t0=performance.now();
      (function step(now){
        const u=Math.min(1,(now-t0)/dur);
        place(from.x+(to.x-from.x)*u, from.y+(to.y-from.y)*u - h*4*u*(1-u)); angle+=9;
        if(u<1) requestAnimationFrame(step); else res();
      })(t0);
    });
  }
  const wait = ms => new Promise(r=>setTimeout(r, ms*speed()));
  function flash(text,color){ result.textContent=text; result.style.color=color; result.classList.add("show"); }
  function swish(){ if(reduce) return; const n=$("net"); n.style.transition="transform .12s"; n.style.transformOrigin="640px 182px"; n.style.transform="scaleY(1.18)"; setTimeout(()=>n.style.transform="scaleY(1)",160*speed()); }
  async function animateShot(made){
    result.classList.remove("show");
    arm.setAttribute("x2","176"); arm.setAttribute("y2","178");
    place(START.x,START.y); await wait(120);
    if(made){
      await arc(START,{x:640,y:170},150,900); swish();
      await arc({x:640,y:170},{x:640,y:250},0,220);
      flash("Score!","var(--make)");
      await arc({x:640,y:250},{x:600,y:343},20,360);
    } else {
      const front=Math.random()<0.5, hit= front?{x:604,y:166}:{x:684,y:166};
      await arc(START,hit,150,880);
      flash("Miss","var(--miss)");
      await arc(hit, front?{x:520,y:343}:{x:560,y:343}, 70, 520);
    }
    arm.setAttribute("x2","166"); arm.setAttribute("y2","186");
    await wait(250); place(START.x,START.y);
  }

  // logic
  async function shootOnce(){
    const made=Math.random()<state.p;
    await animateShot(made);
    state.current.push(made);
    if(made){ renderAttempts(true); state.current=[]; }
    else renderAttempts(false);
    save();
    return made;
  }
  async function playRound(){ let g=0; while(g++<60){ if(await shootOnce()) break; } }
  function lock(v){ busy=v; ["untilBtn","oneBtn","fiveBtn","p"].forEach(id=>$(id).disabled=v); }
  $("oneBtn").onclick=async()=>{ if(busy) return; lock(true); await shootOnce(); lock(false); };
  $("untilBtn").onclick=async()=>{ if(busy) return; lock(true); await playRound(); lock(false); };
  $("fiveBtn").onclick=async()=>{ if(busy) return; lock(true); for(let r=0;r<5;r++){ await playRound(); await wait(500); } lock(false); };

  // rendering
  const fmt=(v,d=2)=>(v==null||!isFinite(v))?"–":v.toFixed(d);
  function renderAttempts(justScored){
    const el=$("attempts"), seq=state.current.slice();
    el.innerHTML='<span class="lbl">This round:</span>';
    if(!seq.length && !justScored){ el.innerHTML+='<span style="color:var(--muted)">Press a shoot button to start.</span>'; return; }
    seq.forEach((m,i)=>{ const d=document.createElement("span"); d.className="dot "+(m?"make":"miss"); d.textContent=i+1; d.title=m?"Score":"Miss"; el.appendChild(d); });
    if(justScored){ const s=document.createElement("span"); s.style.marginLeft="6px"; s.style.fontWeight="700"; s.textContent="X = "+seq.length; el.appendChild(s); }
  }

  function renderAll(){
    $("p").value=state.p; $("pVal").textContent=state.p.toFixed(2);
    $("pMean").textContent="E(X) = 1/p = "+(1/state.p).toFixed(2);
    renderAttempts(false);
  }
  place(START.x,START.y); renderAll();
})();
</script>
</body>
</html>
